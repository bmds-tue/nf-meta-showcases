config_version: 0.1.0
globals:
  config_file: nfcore_profiles.config
workflows:
  n01:
    name: nf-core/mhcquant
    version: 3.0.0
    params:
      fasta: https://raw.githubusercontent.com/nf-core/test-datasets/mhcquant/testdata/UP000005640_9606.fasta
      input: https://raw.githubusercontent.com/nf-core/test-datasets/mhcquant/testdata/HepG2_sample_sheet.tsv
      outdir: out_mhcquant_2
  adap01:
    name: mhcquant2hlatyping
    version: 8b4ffca
    url: https://github.com/bmds-tue/nf-meta-mhcquant2hlatyping
    params:
      mhcquant_outdir: ${n01:params:outdir}
      outdir: /mnt/volume/dev/nf-core/nf-meta/test_run/adap01
  n02:
    name: nf-core/hlatyping
    version: 2.2.0
    params:
      input: ${adap01:params:outdir}/samplesheet.csv
      tools: immunotype
      outdir: out_hlatyping
  adap02:
    name: hlatyping2epp
    version: 3030b11
    url: https://github.com/bmds-tue/nf-meta-hlatyping2epp
    params:
      hlatyping_outdir: ${n02:params:outdir}
      outdir: out_hlatyp2epp
  adap03:
    name: mhcquant2epp_peptide
    version: 2c340f4
    url: https://github.com/bmds-tue/nf-meta-mhcquant2epp_peptide
    params:
      samplesheet: ${adap02:params:outdir}/samplesheet.csv
      mhcquant_outdir: ${n01:params:outdir}
      outdir: out_mhcquant2epp_pep_2
  n03:
    name: nf-core/epitopeprediction
    version: 3.1.0
    params:
      input: ${adap03:params:outdir}/samplesheet.csv
      outdir: out_epp2
  ne2366326:
    name: nf-core/fetchngs
    version: 0ae5518
    params:
      input: fetchngs_ids_scTCRseq.csv
      outdir: out_fetchngs_scTCRseq
  adap04:
    name: bmds-tue/samplesheet-ops
    url: https://github.com/bmds-tue/samplesheet-ops
    version: v1.0.0
    params:
      samplesheet1: ${ne2366326:params:outdir}/samplesheet/samplesheet.csv
      samplesheet2: tcrseq_metadata.csv
      ops: merge
      merge_on: sample
      outdir: out_ssprep_airflow
      outname: samplesheet.tsv
  n9f3630f5:
    name: nf-core/airrflow
    version: 5.0.0
    params:
      outdir: out_airrflow_TCRrepertoir
      input: ${adap04:params:outdir}/samplesheet.tsv
      mode: fastq
      library_generation_method: sc_10x_genomics
      reference_10x: https://cf.10xgenomics.com/supp/cell-vdj/refdata-cellranger-vdj-GRCh38-alts-ensembl-5.0.0.tar.gz
  nc5c073c3:
    name: TCRpMHC-pred* (work in progress)
    version: 1.2.3
    url: https://github.com
transitions:
- target: adap01
  source: n01
- target: adap03
  source: n01
- target: n02
  source: adap01
- target: adap02
  source: n02
- target: adap03
  source: adap02
- target: n03
  source: adap03
- target: nc5c073c3
  source: n03
- target: n9f3630f5
  source: ne2366326
- target: nc5c073c3
  source: n9f3630f5
- target: adap04
  source: ne2366326
- target: n9f3630f5
  source: adap04
