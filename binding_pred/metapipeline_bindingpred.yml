# yaml-language-server: $schema=https://raw.githubusercontent.com/bmds-tue/nf-meta/refs/heads/main/schemas/metapipeline.schema.json
config_version: 0.5.0
globals:
  nextflow_version: '26.04'
inputs:
  mhcquant_input:
    default: mhcquant_samplesheet.tsv
  mhcquant_reference_peptide:
    default: reference_peptide/uniprot_w_dnajb1_prkaca_fusion.fasta
  netmhcpan_path:
    default: /mnt/lustre/home/nahnsen/nahfl959/metapipelines/netmhcpan/netMHCpan-4.1b.Linux.tar.gz
  tcresq_input:
    default: tcrseq_metadata.csv
  reference_10x:
    default: https://cf.10xgenomics.com/supp/cell-vdj/refdata-cellranger-vdj-GRCh38-alts-ensembl-5.0.0.tar.gz
steps:
  mqp:
    name: nf-core/mhcquant
    version: 3.2.0
    params:
      outdir: out_mhcquant_2
      input: ${inputs:mhcquant_input}
      fasta: ${inputs:mhcquant_reference_peptide}
  mq2ep:
    name: mhcquant2epp_peptide
    url: https://github.com/bmds-tue/nf-meta-showcases
    main_script: binding_pred/connectors/mhcquant2epp/main.nf
    version: d830daa1f34914d2c6866fe5ae643d2d27283e7e
    params:
      samplesheet: ${inputs:mhcquant_input}
      mhcquant_outdir: ${mqp:params:outdir}
      outdir: out_mhcquant2epp
    from: [mqp]
  epp:
    name: nf-core/epitopeprediction
    version: cc9920b
    params:
      input: ${mq2ep:params:outdir}/samplesheet.csv
      outdir: out_epitopepred
      tools: netmhcpan
      netmhcpan_path: ${inputs:netmhcpan_path}
    from: [mq2ep]
  fngsids:
    name: extract-fetchngs-ids
    version: v1.4.0
    url: https://github.com/bmds-tue/samplesheet-ops
    params:
      samplesheet1: ${inputs:tcresq_input}
      ops: select_columns
      select_columns_cols: sample
      drop_header: true
      outname: fetchngs_ids.csv
      outdir: out_fetchngs_ids
  fngs:
    name: nf-core/fetchngs
    version: 1.13.0
    params:
      input: ${fngsids:params:outdir}/fetchngs_ids.csv
      outdir: out_fetchngs_scTCRseq
    from: [fngsids]
  fnrn:
    name: rename-samples
    url: https://github.com/bmds-tue/nf-meta-showcases
    main_script: binding_pred/connectors/rename-samples/main.nf
    version: d830daa1f34914d2c6866fe5ae643d2d27283e7e
    params:
      samplesheet: ${fngs:params:outdir}/samplesheet/samplesheet.csv
      read_cols: fastq_1=R1,fastq_2=R2
      name_template: 10x_mkfastq
      file_op: symlink
      outdir: out_sample_rename
    from: [fngs]
  fnmrg:
    name: merge-drop-rename-cols
    version: v1.4.0
    url: https://github.com/bmds-tue/samplesheet-ops
    params:
      samplesheet1: ${fnrn:params:outdir}/samplesheet/samplesheet.csv
      samplesheet2: ${inputs:tcresq_input}
      ops: merge,select_columns,rename
      merge_on: sample
      merge_how: left
      select_columns_cols: sample,fastq_1,fastq_2,subject_id,species,pcr_target_locus,tissue,sex,age,biomaterial_provider,single_cell
      rename_cols: sample=sample_id,fastq_1=filename_R1,fastq_2=filename_R2
      outdir: out_samplesheet_ops
      outname: airrflow_samplesheet.tsv
    from: [fnrn]
  aftcr:
    name: nf-core/airrflow
    version: 5.1.0
    params:
      outdir: out_airrflow_TCRrepertoir
      input: ${fnmrg:params:outdir}/airrflow_samplesheet.tsv
      mode: fastq
      clonal_threshold: 0
      library_generation_method: sc_10x_genomics
      reference_10x: ${inputs:reference_10x}
    from: [fnmrg]
  af2pf:
    name: nf-meta-airrflow2proteinfold
    version: 794fe26
    url: https://github.com/bmds-tue/nf-meta-airrflow2proteinfold.git
    from: [epp, aftcr]
  t2pmhc:
    name: TCRpMHC-pred* (work in progress)
    version: 1.2.3
    url: https://gitlab.com
    from: [af2pf]
