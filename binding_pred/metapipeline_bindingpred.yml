config_version: 0.1.0
workflows:
  nef691f36:
    id: nef691f36
    name: nf-core/mhcquant
    version: 3.1.0
    url: https://github.com/nf-core/mhcquant
    params:
      input: samplesheet.tsv
      outdir: out_mhcquant
  n757d644e:
    id: n757d644e
    name: nf-core/epitopeprediction
    version: 3.1.0
    url: https://github.com/nf-core/epitopeprediction
    params:
      input: ${nfb323625:params:outdir}/samplesheet.csv
      outdir: out_epp
  nfb323625:
    id: nfb323625
    name: mhcquant2epp_peptide
    version: main
    url: https://github.com/bmds-tue/nf-meta-mhcquant2epp_peptide
    params:
      samplesheet: epp_samplesheet.csv
      mhcquant_outdir: ${nef691f36:params:outdir}/
      outdir: out_mhcquant2epp
  n01:
    id: n01
    name: nf-core/mhcquant
    version: 3.1.0
    url: https://github.com/nf-core/mhcquant
    params:
      input: https://raw.githubusercontent.com/nf-core/mhcquant/master/assets/samplesheet.tsv
      outdir: out_mhcquant_2
    profile: docker
  adap01:
    id: adap01
    name: mhcquant2hlatyping
    version: main
    url: https://github.com/bmds-tue/nf-meta-mhcquant2hlatyping
    params:
      mhcquant_outdir: ${n01:params:outdir}
      outdir: /mnt/volume/dev/nf-core/nf-meta/test_run/adap01
  n02:
    id: n02
    name: nf-core/hlatyping
    version: dev
    url: https://github.com/nf-core/hlatyping
    params:
      input: ${adap01:params:outdir}/samplesheet.csv
      tools: immunotype
      outdir: out_hlatyping
    profile: docker
  adap02:
    id: adap02
    name: hlatyping2epp
    version: main
    url: https://github.com/bmds-tue/nf-meta-hlatyping2epp
    params:
      hlatyping_outdir: ${n02:params:outdir}
      outdir: out_hlatyp2epp
  adap03:
    id: adap03
    name: mhcquant2epp_peptide
    version: main
    url: https://github.com/bmds-tue/nf-meta-mhcquant2epp_peptide
    params:
      samplesheet: ${adap02:params:outdir}/samplesheet.csv
      mhcquant_outdir: ${n01:params:outdir}
      outdir: out_mhcquant2epp_pep_2
  n03:
    id: n03
    name: nf-core/epitopeprediction
    version: 3.1.0
    url: https://github.com/nf-core/epitopeprediction
    params:
      input: ${adap03:params:outdir}/samplesheet.csv
      outdir: out_epp2
    profile: docker
transitions:
- target: nfb323625
  source: nef691f36
- target: n757d644e
  source: nfb323625
- target: adap01
  source: n01
- target: adap03
  source: n01
- target: n02
  source: adap01
- target: adap02
  source: n02
- target: adap03
  source: adap02
- target: n03
  source: adap03
